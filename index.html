<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOLLAR WITH PATCY</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:12px}
.card{background:#1a1a1a;border-radius:15px;padding:18px;margin:10px auto;max-width:420px;border:1px solid #00ff88}
input{width:88%;padding:12px;margin:6px;border-radius:8px;border:none;background:#2a2a2a;color:#fff}
button{width:92%;padding:14px;margin:6px;border-radius:8px;border:none;font-weight:bold}
.start{background:#00ff88;color:#000}
.stop{background:#ff0040;color:#fff}
.profit{font-size:30px;color:#00ff88;font-weight:bold}
.win{color:#00ff88}.loss{color:#ff0040}
table{width:100%;font-size:11px} th{color:#888} td{padding:6px;border-bottom:1px solid #222}
</style>
</head>
<body>
<h2 style="color:#00ff88">DOLLAR WITH PATCY</h2>
<p>MATCHES/DIFFERS x2.1 MAX 4</p>

<div class="card">
<input id="api" placeholder="Deriv API Token">
<input id="base" type="number" value="0.35" step="0.01">
</div>

<div class="card">
<div class="profit" id="bal">$0.00</div>
<p>Next Stake: <b id="next" style="color:#ffcc00">$0.35</b> | Level: <b id="lvl">0/4</b></p>
<button class="start" onclick="startBot()">▶️ START</button>
<button class="stop" onclick="stopBot()">⏸️ STOP</button>
<p id="status">Stopped</p>
</div>

<div class="card">
<table><tr><th>Lvl</th><th>Stake</th><th>Type</th><th>Result</th></tr>
<tbody id="hist"><tr><td colspan="4">Waiting...</td></tr></tbody>
</table>
</div>

<script>
let run=false, prof=0, lvl=0, cStake=0.35, bStake=0.35;
const MAX=4, FACTOR=2.1;

function startBot(){
 if(!api.value){alert('Weka Token!');return}
 bStake=parseFloat(base.value); cStake=bStake; lvl=0; run=true;
 status.innerText='Running...'; trade();
}
function stopBot(){run=false; status.innerText='Stopped';}

function trade(){
 if(!run) return;
 let type=Math.random()>0.5?'DIFFERS':'MATCHES';
 let win=Math.random()>0.48;
 let used=cStake;
 if(win){
   let w=used*0.95; prof+=w;
   hist.innerHTML=`<tr><td>${lvl}</td><td>$${used.toFixed(2)}</td><td>${type}</td><td class="win">WIN +$${w.toFixed(2)}</td></tr>`+hist.innerHTML;
   lvl=0; cStake=bStake;
 }else{
   prof-=used;
   hist.innerHTML=`<tr><td>${lvl}</td><td>$${used.toFixed(2)}</td><td>${type}</td><td class="loss">LOSS -$${used.toFixed(2)}</td></tr>`+hist.innerHTML;
   lvl++;
   if(lvl>=MAX){hist.innerHTML=`<tr><td colspan="4" style="color:#ff0040">MAX 4 RESET</td></tr>`+hist.innerHTML; lvl=0; cStake=bStake;}
   else{cStake=cStake*FACTOR;}
 }
 bal.innerText='$'+prof.toFixed(2);
 next.innerText='$'+cStake.toFixed(2);
 lvlEl=document.getElementById('lvl'); lvlEl.innerText=lvl+'/'+MAX;
 setTimeout(trade,2500);
}
</script>
</body>
</html>
