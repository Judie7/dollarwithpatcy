<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI ACCUMULATOR BOT</title>
<style>
body{background:#0a0e1a;color:#fff;font-family:Arial;padding:10px;margin:0}
.top{background:#00ff88;color:#000;padding:14px;border-radius:12px;text-align:center;font-weight:900}
.card{background:#151c2c;border-radius:10px;padding:10px;margin-top:10px}
button{width:100%;padding:16px;border:0;border-radius:10px;font-weight:900}
input{width:100%;padding:12px;background:#111;color:#fff;border:1px solid #333;border-radius:8px;box-sizing:border-box}
.d{font-size:50px;text-align:center;color:#00ff88;font-weight:900}
</style>
</head>
<body>
<div class="top">AI ACCUMULATOR BOT - PATCY</div>
<div class="card">
<input id="tok" type="password" placeholder="Paste REAL token a1-...">
<button onclick="connect()" style="background:#333;color:#fff;margin-top:8px">CONNECT REAL</button>
<div id="bal">Balance: -</div>
<div id="stat" style="font-size:12px">Ready</div>
</div>
<div class="card">
<div id="dig" class="d">AI ANALYZING</div>
<div id="ai" style="text-align:center;font-size:11px">Waiting ticks...</div>
<button onclick="startAI()" style="background:#00ff88;color:#000;margin-top:8px" id="btn">START AI ACCUMULATOR ONE RUN</button>
<div id="prof" style="text-align:center;font-size:22px;color:#00ff88;margin-top:6px">Profit $0</div>
</div>
<div class="card" id="log" style="font-size:12px">No trades</div>
<script>
let ws=null,history=[],tick=0,running=false,cid=null;
function connect(){
 let tk=document.getElementById('tok').value.trim();
 if(!tk){alert('weka token');return;}
 ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
 ws.onopen=()=>ws.send(JSON.stringify({authorize:tk}));
 ws.onmessage=(e)=>{
  let d=JSON.parse(e.data);
  if(d.error){document.getElementById('stat').innerText=d.error.message;return;}
  if(d.msg_type=='authorize'){document.getElementById('bal').innerText='Balance $'+d.authorize.balance+' '+d.authorize.loginid;document.getElementById('stat').innerText='CONNECTED REAL - AI Ready';ws.send(JSON.stringify({ticks:'R_100',subscribe:1}));ws.send(JSON.stringify({proposal_open_contract:1,subscribe:1}));}
  if(d.msg_type=='tick'){tick=parseFloat(d.tick.quote);let lastDigit=parseInt(d.tick.quote.toString().slice(-1));history.push(lastDigit);if(history.length>30)history.shift();document.getElementById('dig').innerText=tick.toFixed(2);analyze();}
  if(d.proposal_open_contract && d.proposal_open_contract.contract_id){
   cid=d.proposal_open_contract.contract_id;
   let p=d.proposal_open_contract.profit;
   document.getElementById('prof').innerText='Profit $'+p.toFixed(2)+' / Growth: '+d.proposal_open_contract.contract_type;
   if(d.proposal_open_contract.is_sold){running=false;document.getElementById('log').innerHTML='<div style="color:'+(p>0?'#00ff88':'#ff4444')+'">CLOSED Profit $'+p.toFixed(2)+'</div>'+document.getElementById('log').innerHTML;document.getElementById('btn').innerText='START AI ACCUMULATOR ONE RUN';}
  }
 };
}
function analyze(){
 if(history.length<10)return;
 // AI: angalia volatility ya digits
 let volatile=false;
 let diff=0;for(let i=1;i<history.length;i++)diff+=Math.abs(history[i]-history[i-1]);
 let avgVol=diff/history.length;
 let growth = avgVol<3? 0.05 : avgVol<5? 0.03 : 0.01; // AI inachagua growth rate kulingana na market
 document.getElementById('ai').innerText='AI: Volatility '+avgVol.toFixed(1)+' | Chosen Growth '+(growth*100)+'% | Least risk | Ticks: '+history.slice(-10).join(',');
 return growth;
}
function startAI(){
 if(!ws){alert('Connect first');return;}
 if(running)return;
 let g=analyze()||0.03;
 running=true;
 document.getElementById('btn').innerText='AI RUNNING - Growth '+(g*100)+'%';
 document.getElementById('stat').innerText='Buying Accumulator growth '+(g*100)+'%';
 ws.send(JSON.stringify({buy:1,price:1,parameters:{amount:1,basis:'stake',contract_type:'ACCU',currency:'USD',symbol:'R_100',growth_rate:g,limit_order:{take_profit:30}}}));
}
</script>
</body>
</html>
