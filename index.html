<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>DOLLARS WITH PATCY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#fff;font-family:Arial;padding:10px}
.top{background:linear-gradient(90deg,#ffcc00,#ff8800);color:#000;padding:14px;border-radius:14px;text-align:center;font-weight:900}
.card{background:#151c2c;border:1px solid #ffcc00;border-radius:12px;padding:12px;margin:8px 0}
.bal{color:#00ff88;font-weight:900;font-size:22px}
.digit{font-size:64px;text-align:center;font-weight:900;color:#ffcc00}
button{padding:12px;border:none;border-radius:10px;font-weight:900;margin:3px;flex:1}
input{width:100%;padding:10px;border-radius:8px;background:#1f2937;color:#fff;border:1px solid #374151;margin:4px 0}
</style>
</head>
<body>
<div class="top">💰 DOLLARS WITH PATCY - FIXED ENGINE</div>
<div class="card" style="display:flex;justify-content:space-between"><div><b style="color:#ffcc00" id="mode">ENGINE READY</b><br><small id="profit">Profit: $0.00</small><br><small id="acc">DEMO $1000</small></div><div style="text-align:right"><div class="bal" id="bal">$1000.00</div><small id="wl">0W/0L</small></div></div>
<div class="card"><div id="digit" class="digit">5</div><div style="text-align:center"><small id="status" style="color:#00ff88">LIVE</small></div></div>
<div class="card">
<input id="stake" type="number" value="10">
<div style="display:flex"><button onclick="setS(1)" style="background:#fff;color:#000">$1</button><button onclick="setS(5)" style="background:#fff;color:#000">$5</button><button onclick="setS(10)" style="background:#ffcc00;color:#000">$10=$400</button></div>
<div style="display:flex;margin-top:8px"><button onclick="startAI()" style="background:#7c3aed;color:#fff">AI BOT TRADE</button><button onclick="startManual()" style="background:#ffcc00;color:#000">MANUAL BOT</button></div>
<div style="display:flex"><button onclick="stopBot()" style="background:#ef4444;color:#fff;width:100%">STOP</button></div>
<div id="manual" style="display:none;margin-top:10px"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">
<button onclick="trade(0)" style="background:#222;color:#fff">0</button><button onclick="trade(1)" style="background:#222;color:#fff">1</button><button onclick="trade(2)" style="background:#222;color:#fff">2</button><button onclick="trade(3)" style="background:#222;color:#fff">3</button><button onclick="trade(4)" style="background:#222;color:#fff">4</button><button onclick="trade(5)" style="background:#222;color:#fff">5</button><button onclick="trade(6)" style="background:#222;color:#fff">6</button><button onclick="trade(7)" style="background:#222;color:#fff">7</button><button onclick="trade(8)" style="background:#222;color:#fff">8</button><button onclick="trade(9)" style="background:#222;color:#fff">9</button>
</div></div>
</div>
<div class="card"><div id="hist">No trades yet</div></div>
<script>
let RUN=false,BAL=1000,PROF=0,W=0,L=0,last=5,t=null;
function setS(v){document.getElementById('stake').value=v}
function startLive(){clearInterval(t);t=setInterval(()=>{last=Math.floor(Math.random()*10);document.getElementById('digit').innerText=last},700)}
function trade(d){if(!RUN){alert('Start BOT first');return;}let s=parseFloat(document.getElementById('stake').value)||10;let win=Math.random()<0.55;let p=win?s*40:-s;BAL+=p;PROF+=p;if(win)W++;else L++;document.getElementById('bal').innerText='$'+BAL.toFixed(2);document.getElementById('profit').innerText='Profit: $'+PROF.toFixed(2);document.getElementById('wl').innerText=W+'W/'+L+'L';let c=win?'#00ff88':'#ef4444';document.getElementById('hist').innerHTML=`<div style="display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #222"><span>MATCH ${d}</span><span>$${s}</span><span style="color:${c}">${win?'WIN $'+p:'LOSS'}</span></div>`+document.getElementById('hist').innerHTML;document.getElementById('status').innerText=(win?'WIN ':'LOSS ')+d}
function startAI(){RUN=true;document.getElementById('mode').innerText='AI RUNNING';document.getElementById('manual').style.display='none';let l=()=>{if(!RUN)return;trade(last);setTimeout(l,2000)};l()}
function startManual(){RUN=true;document.getElementById('mode').innerText='MANUAL READY';document.getElementById('manual').style.display='block'}
function stopBot(){RUN=false}
startLive();
</script>
</body>
</html>
