<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>DOLLARS WITH PATCY - REAL ENGINE</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#060a14;color:#fff;font-family:Arial;padding:8px}.h{background:linear-gradient(90deg,#ffcc00,#00ff88);color:#000;padding:12px;border-radius:12px;text-align:center;font-weight:900}.card{background:#121a2e;border:1px solid #ffcc00;border-radius:10px;padding:8px;margin:6px 0}.bal{font-size:20px;color:#00ff88;font-weight:900}.live{font-size:40px;text-align:center;color:#ffcc00;font-weight:900}button{padding:10px;border-radius:8px;border:none;font-weight:900;margin:2px;flex:1}.ai{background:linear-gradient(90deg,#7c3aed,#00ff88);color:#fff}.manual{background:linear-gradient(90deg,#ffcc00,#ff8800);color:#000}.stop{background:#ff2340;color:#fff}input{width:100%;padding:8px;border-radius:6px;background:#1e293b;color:#fff;border:1px solid #444;margin:2px 0;font-size:12px}small{font-size:10px}</style></head><body>
<div class="h">💰 DOLLARS WITH PATCY<br>REAL DERIV ENGINE</div>
<div class="card">
<input id="token" type="password" placeholder="Weka Deriv API Token hapa">
<small style="color:#ffcc00">Pata token: Deriv → Settings → API Token → Create</small>
<div style="display:flex;gap:4px;margin-top:4px"><button onclick="connectDeriv()" style="background:#00ff88;color:#000">CONNECT</button><button onclick="disconnect()" style="background:#333;color:#fff">DISCONNECT</button></div>
<small id="connStatus" style="color:#ff4455">Not Connected - DEMO Mode</small>
</div>
<div class="card" style="display:flex;justify-content:space-between"><div><b id="modeTxt" style="color:#ffcc00">ENGINE READY</b><br><small id="pnl">Profit: $0.00</small><br><small id="accInfo">Balance: DEMO $1000</small></div><div style="text-align:right"><div class="bal" id="bal">$1000.00</div><small id="stats">0W/0L</small></div></div>
<div class="card"><div id="digit" class="live">-</div><div style="text-align:center"><small id="log">Connect Deriv token kwanza</small></div></div>
<div class="card">
<input id="stake" type="number" value="10" min="0.35"><div style="display:flex"><button onclick="setS(1)">$1</button><button onclick="setS(5)">$5</button><button onclick="setS(10)" style="background:#ffcc00;color:#000">$10=$400</button></div>
<div style="display:flex;margin-top:4px"><button class="ai" onclick="startAI()">🤖 AI BOT TRADE</button><button class="manual" onclick="startManual()">👆 MANUAL BOT</button></div>
<div style="display:flex"><button class="stop" onclick="stopBot()">STOP</button></div>
<div id="manualPanel" style="display:none"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:4px">
<button onclick="trade(0)" style="background:#222;color:#fff">0</button><button onclick="trade(1)" style="background:#222;color:#fff">1</button><button onclick="trade(2)" style="background:#222;color:#fff">2</button><button onclick="trade(3)" style="background:#222;color:#fff">3</button><button onclick="trade(4)" style="background:#222;color:#fff">4</button><button onclick="trade(5)" style="background:#222;color:#fff">5</button><button onclick="trade(6)" style="background:#222;color:#fff">6</button><button onclick="trade(7)" style="background:#222;color:#fff">7</button><button onclick="trade(8)" style="background:#222;color:#fff">8</button><button onclick="trade(9)" style="background:#222;color:#fff">9</button>
</div></div>
</div>
<script>
let RUN=false,MODE='',BAL=1000,PROF=0,CUR=10,W=0,L=0,ws=null,isReal=false,lastDigit=0;
function setS(v){document.getElementById('stake').value=v;CUR=v;}
function log(t){document.getElementById('log').innerText=t}
function connectDeriv(){
let token=document.getElementById('token').value.trim();
if(!token){alert('Weka Deriv Token!');return;}
log('Connecting to Deriv...');
ws=new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');
ws.onopen=()=>{ws.send(JSON.stringify({authorize:token}))};
ws.onmessage=(msg)=>{
let data=JSON.parse(msg.data);
if(data.msg_type=='authorize'){isReal=true;BAL=data.authorize.balance;document.getElementById('bal').innerText='$'+BAL.toFixed(2);document.getElementById('accInfo').innerText=data.authorize.loginid+' REAL';document.getElementById('connStatus').innerText='✅ Connected REAL - $'+BAL.toFixed(2);document.getElementById('connStatus').style.color='#00ff88';log('Connected! Balance $'+BAL.toFixed(2));ws.send(JSON.stringify({ticks:'R_100'}));}
if(data.msg_type=='tick'){lastDigit=parseInt(data.tick.quote.toString().slice(-1));document.getElementById('digit').innerText=lastDigit;}
if(data.msg_type=='buy'){log('Trade Placed! ID:'+data.buy.contract_id);}
if(data.msg_type=='proposal_open_contract'){let c=data.proposal_open_contract;if(c.is_sold){let p=parseFloat(c.profit);finishReal(p,c);}}
};
ws.onerror=()=>{log('Connection error - DEMO mode');startDemoTicks();}
}
function startDemoTicks(){
isReal=false;
setInterval(()=>{let d=Math.floor(Math.random()*10);document.getElementById('digit').innerText=d;lastDigit=d;},800);
}
function trade(digit){
if(!RUN)return;
CUR=parseFloat(document.getElementById('stake').value);
if(isReal&&ws){ws.send(JSON.stringify({buy:1,price:CUR,parameters:{amount:CUR,basis:'stake',contract_type:'DIGITMATCH',currency:'USD',duration:1,duration_unit:'t',symbol:'R_100',barrier:digit.toString()}}));log('Placing REAL Trade MATCHES '+digit+' $'+CUR);}
else{let win=Math.random()<0.55;let profit=win?CUR*8:-CUR;log((win?'WIN':'LOSS')+' MATCHES '+digit);finishDemo(profit,digit);}
}
function startAI(){
MODE='AI';RUN=true;CUR=parseFloat(document.getElementById('stake').value);document.getElementById('modeTxt').innerText='🤖 AI RUNNING';if(!isReal)startDemoTicks();
log('AI Trading...');
let loop=()=>{if(!RUN||MODE!='AI')return;trade(lastDigit);setTimeout(loop,3000);};loop();
}
function startManual(){MODE='MANUAL';RUN=true;document.getElementById('manualPanel').style.display='block';document.getElementById('modeTxt').innerText='👆 MANUAL READY';if(!isReal)startDemoTicks();log('Choose digit 0-9 to trade');}
function stopBot(){RUN=false;log('Stopped');}
function finishDemo(profit,digit){
let win=profit>0;if(win)W++;else L++;PROF+=profit;if(!isReal)BAL+=profit;
document.getElementById('pnl').innerText='Profit: $'+PROF.toFixed(2);document.getElementById('bal').innerText='$'+BAL.toFixed(2);document.getElementById('stats').innerText=W+'W/'+L+'L';
}
function finishReal(profit,contract){
let win=profit>0;if(win)W++;else L++;PROF+=profit;BAL+=profit;
document.getElementById('pnl').innerText='Profit: $'+PROF.toFixed(2);document.getElementById('bal').innerText='$'+BAL.toFixed(2);document.getElementById('stats').innerText=W+'W/'+L+'L';
log((win?'WIN $'+profit.toFixed(2):'LOSS $'+profit.toFixed(2))+' Last:'+contract.tick_value
