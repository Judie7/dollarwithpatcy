<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>DOLLARS WITH PATCY</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#06060a;color:#fff;font-family:Arial;padding:10px}.h{background:linear-gradient(90deg,#ffcc00,#00ff88);color:#000;padding:18px;border-radius:15px;text-align:center;font-weight:900;font-size:20px}.card{background:#14141f;border:1px solid #333;border-radius:14px;padding:14px;margin:10px 0}.bal{font-size:32px;color:#00ff88;font-weight:900}.live{font-size:60px;text-align:center;font-weight:900;color:#ffcc00}input,select{width:100%;padding:12px;margin:5px 0;border-radius:10px;background:#1f1f2d;color:#fff;border:1px solid #444}button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:900;margin:5px 0}.start{background:#00ff88;color:#000}.stop{background:#ff2340;color:#fff}</style></head><body>
<div class="h">💵 DOLLARS WITH PATCY - x2.1</div>
<div class="card"><b id="acc">DEMO MODE</b> - <span id="bal" style="color:#00ff88;font-weight:900">$1000.00</span><br><small id="pnl">Profit: $0.00</small> | <b id="nextStake" style="color:#ffcc00">$0.35</b> | <span id="lvl">0/4</span> | <span id="wr">0%</span></div>
<div class="card"><div id="digit" style="font-size:60px;text-align:center;color:#ffcc00;font-weight:900">-</div><div style="text-align:center"><small id="log" style="color:#00ff88">Ready - Press START - No Token Needed</small></div></div>
<div class="card"><select id="baseStake"><option value="0.35">Base $0.35</option><option value="0.5">$0.50</option><option value="1">$1</option></select><button class="start" onclick="startBot()">▶️ START DOLLARS WITH PATCY x2.1</button><button class="stop" onclick="stopBot()">⏸️ STOP</button></div>
<div class="card"><table style="width:100%;font-size:11px"><tr><th>Lvl</th><th>Stake</th><th>Type</th><th>Result</th></tr><tbody id="hist"><tr><td colspan="4">Press START</td></tr></tbody></table></div>
<script>
let RUN=false,BAL=1000,PROF=0,LVL=0,BASE=0.35,CUR=0.35,W=0,L=0;const MAX=4;let I=null;function log(t){document.getElementById('log').innerText=t}
function startBot(){BASE=parseFloat(document.getElementById('baseStake').value);CUR=BASE;RUN=true;log('Running x2.1...');I=setInterval(()=>{if(RUN)document.getElementById('digit').innerText=Math.floor(Math.random()*10)},800);setTimeout(trade,1000)}
function stopBot(){RUN=false;clearInterval(I);log('Stopped')}
let PT='',PB='';
function trade(){if(!RUN)return;PT=Math.random()>0.5?'MATCHES':'DIFFERS';PB=Math.floor(Math.random()*10).toString();log(PT+' '+PB+' $'+CUR.toFixed(2));let win=Math.random()>0.42;setTimeout(()=>finish(win?CUR*0.9:-CUR),1200)}
function finish(p){let win=p>0;if(win){W++;PROF+=p;LVL=0;CUR=BASE}else{L++;PROF+=p;LVL++;if(LVL>=MAX){LVL=0;CUR=BASE}else{CUR=Math.round(CUR*2.1*100)/100}}document.getElementById('pnl').innerText='Profit:$'+PROF.toFixed(2);document.getElementById('nextStake').innerText='$'+CUR.toFixed(2);document.getElementById('lvl').innerText=LVL+'/'+MAX;document.getElementById('wr').innerText=(W+L>0?Math.round(W/(W+L)*100):0)+'%';BAL+=p;document.getElementById('bal').innerText='$'+BAL.toFixed(2);let r='<tr><td>'+LVL+'</td><td>$'+CUR.toFixed(2)+'</td><td>'+PT+' '+PB+'</td><td style="color:'+(win?'#00ff88':'#ff4444')+'">'+(win?'WIN':'LOSS')+' $'+p.toFixed(2)+'</td></tr>';document.getElementById('hist').innerHTML=r+document.getElementById('hist').innerHTML;if(RUN)setTimeout(trade,2500)}
</script></body></html>
